[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "amodem"
version = "1.16.0"
authors = [
  { name = "Roman Zeyde", email = "dev@romanzey.de" },
  { name = "Diógenes Oliveira", email = "diogenes1oliveira@gmail.com" },
]
description = "Audio Modem Communication Library"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["numpy<2"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Networking",
  "Topic :: Communications",
]

[project.scripts]
amodem = "amodem.__main__:_main"
aduplex = "amodem_duplex.__main__:_main"

[project.urls]
Homepage = "https://github.com/diogenes1oliveira/amodem"
Issues = "https://github.com/diogenes1oliveira/amodem/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["amodem*", "amodem_duplex*"]

[dependency-groups]
dev = [
  "black>=25.11.0",
  "mypy>=1.18.2",
  "pytest>=9.0.1",
  "pytest-cov>=7.0.0",
  "pytest-mock>=3.15.1",
  "ruff>=0.14.5",
]

[tool.pytest.ini_options]
testpaths = ["amodem_duplex/tests"]                                      # for now 
addopts = "--doctest-modules --ignore=var/ --ignore=.dev/ --ignore=tmp/"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.ruff]
target-version = "py312"
line-length = 120
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
]
ignore = [
  "E501", # line too long, handled by black
  "B008", # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["amodem", "amodem_duplex"]
